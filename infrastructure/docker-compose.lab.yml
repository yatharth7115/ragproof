services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ragproof_lab
      POSTGRES_USER: ragproof
      POSTGRES_PASSWORD: ${RAGPROOF_LAB_DB_PASSWORD:-local-development-only}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ragproof_lab_postgres:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
      - ../src/ragproof_store/schema.sql:/docker-entrypoint-initdb.d/002-stage-3.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragproof -d ragproof_lab"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4.11-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - ragproof_lab_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${RAGPROOF_MINIO_ACCESS_KEY:-ragproof-local}
      MINIO_ROOT_PASSWORD: ${RAGPROOF_MINIO_SECRET_KEY:-ragproof-local-development-only}
    ports:
      - "127.0.0.1:59000:9000"
      - "127.0.0.1:59001:9001"
    volumes:
      - ragproof_lab_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ragproof_lab_postgres:
  ragproof_lab_redis:
  ragproof_lab_minio:
